# Values for CI (helm lint and helm template). The chart has no default
# database credential, so name a secret that would hold one.
moodle:
  database:
    existingSecret: moodle-db
# THROWAWAY: seeded bug for a negative CI test. Not for merge.
extraVolumes:
  - name: extra
    emptyDir: {}
extraVolumeMounts:
  - name: extra
    mountPath: /var/www/moodledata
